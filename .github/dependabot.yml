# Dependabot (R11, 2026-09-24): automated vulnerability scanning + update
# PRs for Dart packages and GitHub Actions. GitHub's advisory database
# (OSV-backed for pub) raises Dependabot alerts on vulnerable pins; the
# weekly cadence keeps the update noise reviewable. The lockfile stays the
# source of truth — `flutter pub get` still resolves from pubspec.lock.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
