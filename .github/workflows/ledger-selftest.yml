# LegalHub — scheduled teeth-prover for the two repo-local static gates:
# the governance ledger battery (scripts/verify_ledger.sh) and the
# policy-test battery (scripts/verify_policy_tests.sh --check).
# The push/PR gate (ci.yml) runs both batteries on every commit; this
# workflow proves each battery itself still has teeth on a cadence by
# running its --selftest mode (drift-injection: dead hash, missing marker,
# wrong suite claim, dropped verdict, stale README count, dropped citation
# for the ledger; missing battery file, dangling fixture UUID, stripped FAIL
# marker, weakened harness file list, dropped doc hook, broken harness
# syntax for the policy battery — each must red its battery). Needs only
# bash + git, no Flutter toolchain and no database. Runs nightly (02:00 UTC)
# and on demand via workflow_dispatch, so a silent regression in either
# gate's detection logic is caught even if no commit pushes.
# No build, deploy, publish, signing, or release steps are authorized at B2.
name: Governance selftests

on:
  schedule:
    # Nightly at 02:00 UTC. GitHub cron is UTC; the default branch is used.
    # Schedules can be delayed under load — this is a low-priority check, so
    # occasional late starts are acceptable.
    - cron: '0 2 * * *'
  # On-demand trigger so the teeth check can be run immediately after a
  # battery change (Actions → "Governance selftests" → Run workflow), without
  # waiting for the next nightly window or faking a push.
  workflow_dispatch:

# Least privilege: read-only on the triggering repo. The selftest creates a
# scratch worktree inside its own working directory; no secrets are required.
permissions:
  contents: read

jobs:
  governance-selftests:
    name: governance gates --selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history (not shallow): both selftests create a scratch
          # worktree at HEAD and run the battery inside it, and the batteries
          # validate cited hashes against the whole object database
          # (`git rev-list --all`, `git show <hash>:<path>`), so a depth-1
          # clone would make every cited hash look dangling and fail the
          # baseline spuriously.
          fetch-depth: 0

      - name: Prove ledger teeth (--selftest)
        # Exit code 1 (any drift class evading the gate, or a failed
        # baseline) fails the job — same fail-fast philosophy as the
        # ci.yml ledger step.
        run: bash scripts/verify_ledger.sh --selftest

      - name: Prove policy-battery teeth (--selftest)
        # Same teeth philosophy as the ledger selftest, for the policy
        # battery's --check gate (ci.yml): each injected drift class
        # (missing battery file, dangling fixture UUID, stripped FAIL
        # marker, weakened harness file list, dropped doc hook, broken
        # harness syntax) must red the run. DB-free (--check is static;
        # no database is provisioned), bash + git only.
        run: bash scripts/verify_policy_tests.sh --selftest
