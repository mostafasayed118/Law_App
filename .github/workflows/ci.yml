# LegalHub — B2 CI quality gates.
# Bootstrap specification §7 (row B2; + §7.1 owner-approved amendment) + §3.11: run `dart format` (check),
# `flutter analyze`, and `flutter test` on pushes to main and pull requests
# targeting main.
# Plus two repo-local static gates (beyond B2), each needing only bash + git
# so they run before the Flutter toolchain to fail fast:
#  - the governance ledger (scripts/verify_ledger.sh): fails if it cites an
#    unresolvable/dangling hash, misses a byte-exact content marker, or drifts
#    a recorded suite count;
#  - the policy-battery static check (scripts/verify_policy_tests.sh --check,
#    the P0C.1 gate's DB-free structural mode): battery file presence, every
#    fixture UUID resolving in 00_fixtures.sql, every check block carrying the
#    FAIL marker, harness self-syntax + doc hooks.
# No deploy, publish, store upload, artifact distribution, or secret-based
# signing is authorized at B2. Amended 2026-09-23 (owner-approved; spec §7.1,
# audit §12.20): one extra job compiles the release app bundle as a build
# proof after the quality gates pass. CI holds no signing secrets, so the
# bundle uses the documented debug-signing fallback in build.gradle.kts and
# is explicitly not a store artifact.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least privilege: read-only on the triggering repo. No secrets are required or
# used by these checks (the B1 widget test needs no environment configuration).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: format + analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history (not shallow): the ledger gate below validates cited
          # hashes against the whole object database (`git rev-list --all`,
          # `git show <hash>:<path>`), so a depth-1 clone would make every
          # cited hash look dangling and fail the gate spuriously.
          fetch-depth: 0

      - name: Verify governance ledger
        # Static docs gate (scripts/README.md): fails if any hash cited in the
        # audit plan / Gate 3 reconciliation is unresolvable or dangling, a
        # byte-exact content marker is missing, or a recorded suite count has
        # drifted. No Flutter needed — kept before toolchain setup to fail
        # fast and cheap.
        run: bash scripts/verify_ledger.sh

      - name: Verify policy battery (static --check)
        # Static validation of the P0-closure policy battery (scripts/README.md
        # — the P0C.1 gate, D-P0C2): battery file presence, every fixture UUID
        # resolving in 00_fixtures.sql, every check block carrying the FAIL
        # marker, and the harness self-syntax + doc hooks. DB-free (no database
        # is provisioned in CI; the live battery stays the owner-side ephemeral
        # rehearsal gate), so it runs before the toolchain to fail fast and
        # cheap, like the ledger step above.
        run: bash scripts/verify_policy_tests.sh --check

      # Pinned to the Flutter SDK version declared in pubspec.yaml (3.44.4,
      # which ships Dart 3.12.2). Keeping CI on the same toolchain as the
      # lockfile prevents drift in format/analyze/test results.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          # Cache keyed on pubspec.* — speeds up `pub get` without bypassing
          # the lockfile: dependencies still resolve from pubspec.lock.
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Download dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

  release-build-proof:
    # B2 amendment (spec §7.1, audit §12.20, owner-approved 2026-09-23):
    # prove the release app bundle still compiles on a clean machine after
    # every change that lands. CI holds no signing secrets, so the bundle is
    # debug-signed via the documented build.gradle.kts fallback — a compile/
    # size proof, not a store artifact (store AABs are owner-side builds
    # signed with the upload keystore, per audit §12.19).
    name: release AAB compiles
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The Android Gradle build requires JDK 17 (AGP requirement); the
      # runner default does not reliably satisfy it, so pin it the same way
      # the official Flutter deploy workflows do.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          # Cache keyed on pubspec.* — same rationale as the gates job above.
          cache: true

      - name: Download dependencies
        run: flutter pub get

      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Assert bundle exists and report size
        run: |
          test -s build/app/outputs/bundle/release/app-release.aab
          du -h build/app/outputs/bundle/release/app-release.aab