name: legalhub
description: LegalHub - a Flutter legal-services app covering consultations, matter discovery, documents, messaging, and organization workflows.
publish_to: none
version: 1.0.0+1

environment:
  # B1 target pins; confirm before subsequent backlog tickets.
  sdk: '>=3.12.2 <3.13.0'
  # Range, NOT an exact pin — and the exact pin is deliberate at the CI layer:
  # `.github/workflows/ci.yml` pins `flutter-version: '3.44.4'`, which is where
  # reproducibility is actually enforced. An exact pin HERE was tried and
  # measured on 2026-09-22 (owner decision OI-D7.3): `flutter pub get` fails
  # with "Because legalhub requires Flutter SDK version 3.44.4, version solving
  # failed" on a 3.48.0-pre local toolchain, which blocks every local gate
  # (analyze/test/format) for anyone not on the pinned SDK. The Dart constraint
  # above still guards the API level.
  flutter: '>=3.44.4 <4.0.0'

dependencies:
  app_links: ^7.2.1
  bloc: ^9.2.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  intl: 0.20.2
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.16.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  http: ^1.6.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/noto_sans/NotoSans-Variable.ttf
        - asset: assets/fonts/noto_sans/NotoSans-Italic-Variable.ttf
          style: italic
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/noto_naskh_arabic/NotoNaskhArabic-Variable.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/playfair_display/PlayfairDisplay-Variable.ttf
