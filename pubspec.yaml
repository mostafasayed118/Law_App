name: legalhub
description: LegalHub Flutter application bootstrap.
publish_to: none
version: 1.0.0+1

environment:
  # B1 target pins; confirm before subsequent backlog tickets.
  sdk: '>=3.12.2 <3.13.0'
  flutter: '3.44.4'

dependencies:
  bloc: ^9.2.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.2.1
  go_router: ^17.3.0
  intl: 0.20.2
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.16.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/noto_sans/NotoSans-Variable.ttf
        - asset: assets/fonts/noto_sans/NotoSans-Italic-Variable.ttf
          style: italic
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/noto_naskh_arabic/NotoNaskhArabic-Variable.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/playfair_display/PlayfairDisplay-Variable.ttf
